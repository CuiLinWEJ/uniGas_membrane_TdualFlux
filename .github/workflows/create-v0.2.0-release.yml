name: Create v0.2.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v0.2.0-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.2.0 release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: f49c86c19d5dfe104faf1c9113c82e4df856a266
        run: |
          set -euo pipefail

          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v0.2.0 already exists; no action needed."
              exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## uniGas_membrane_TdualFlux v0.2.0

          Verified research-prototype release containing the cyclic-direction rollback correction for the probabilistic permeable-membrane boundary.

          ### Highlights

          - Corrected physical front/back incident-direction classification for local cyclic and processor-cyclic crossings.
          - Added immediate local cyclic rollback for reflected parcels through `uniGasParcel::returnAcrossCyclic()`.
          - Eliminated the cyclic reflection ping-pong behavior observed in the `Pr = 1.00` no-transmission case.
          - Retained the production 17-column membrane-flux output after removing temporary raw-direction diagnostics.
          - Added integration helpers for applying the required `uniGasParcel` wrapper.

          ### Regression verification

          The cyclic-direction revision was exercised with 14 MPI ranks to `t = 0.001 s`:

          - `+X`, `Pr = 0.50`: reflection fraction `0.502565`; front-to-back transmission dominated (`45140` vs `1208`).
          - `+X`, `Pr = 1.00`: `76138` reflections and `0` transmissions; the run completed without the previous reflection hang.
          - `-X`, `Pr = 0.50`: reflection fraction `0.499242`; back-to-front transmission dominated (`72381` vs `2964`).

          A cleanup smoke test also confirmed the production 17-column `membraneFlux.dat` format.

          ### Status

          This is a **verified research prototype**, not a claim of comprehensive physical validation. Independent/reference validation, numerical sensitivity, repeated-run uncertainty, conservation checks, and clean-upstream reproducibility remain future work.
          EOF

          gh release create v0.2.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "uniGas_membrane_TdualFlux v0.2.0" \
              --notes-file /tmp/release-notes.md
